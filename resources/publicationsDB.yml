works-in-progress:
    - title: "Does it add up? Reconciling forecasts and Impulse responses for hierarchical macroeconomic data"
      coauthors: Boris Blagov and Clara Krause
      status: "Working Paper - Ruhr Economic Papers No. 1224"
      biblio: "2026, No. 1224(1)"
      urls:
        - text: PDF
          href: https://www.rwi-essen.de/fileadmin/user_upload/RWI/Publikationen/Ruhr_Economic_Papers/REP_26_1224.pdf
        - text: Citation
          href: https://borisblagov.com/publication/2026_bc/cite.bib
        - text: DOI
          href: https://doi.org/10.4419/96973409
      abstract: >-
        This paper introduces a mixed-frequency Gaussian state-space Framework that embeds forecast
        reconciliation into Bayesian VAR modeling for hierarchical macroeconomic data. Using
        precision-based sampling to generate high-frequency latent estimates, we construct a consistent
        proxy for the forecast-error covariance matrix, enabling optimal reconciliation with short
        datasets. We prove the asymptotic convergence of this estimator and show that forecast
        reconciliation can be formally derived as a special case of conditional forecasting, allowing
        straightforward implementation with Standard state-space algorithms. We derive reconciled
        impulse response functions (rIRFs) that ensure bottom-level structural responses aggregate
        exactly to the top-level impulse response. Applying the framework to UK and German regional
        economic data, we demonstrate improvements in the forecast accuracy alongside structurally
        consistent impulse responses.
    - title: "Measuring political instability at a high frequency "
      coauthors: Niklas Benner, Boris Blagov and Maximillian Dirks
      status: "Working Paper - Ruhr Economic Papers No. 1186"
      biblio: "2025, No. 1186(1)"
      urls:
        - text: PDF
          href: https://www.econstor.eu/bitstream/10419/338082/1/196382007X.pdf
        - text: Citation
          href: https://borisblagov.com/publication/2026_bc/cite.bib
        - text: DOI
          href: https://doi.org/10.4419/96973371
      abstract: >-
        This study introduces the World Index of Political Instability (WIPI), a novel high-frequency measure that covers four dimensions of political instability in 182 countries, available from 1960 until 2024. 
        Our measure is extracted from the curated texts of the Economist Intelligence Unit’s Country Reports using text mining techniques, allowing us to track political instability on a high frequency while matching various established low-frequency proxies. 
        We show that political instability has significant and negative short-run effects on the economy similar to a demand-side shock. In contrast to uncertainty shocks, the observed effects are not immediate but take up to one year until they materialize. 
        The measured effects are stronger in low-income economies than in high-income economies and during recessionary periods.