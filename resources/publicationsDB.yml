publications:
    - title: Improving inference and forecasting in VAR models using cross-sectional information
      coauthors: Boris Blagov and Jan Prüser
      journal: Economic Modelling
      biblio: "2026, Vol. 160, 107618"
      urls:
        - text: PDF
          href: https://www.sciencedirect.com/science/article/pii/S0264999326001471/pdfft?md5=a9e0c645ea30f74fbe46b217b5a2c2fb&pid=1-s2.0-S0264999326001471-main.pdf
        - text: Citation
          href: https://borisblagov.com/publication/2026_pb/cite.bib        
        - text: Slides
          href: https://borisblagov.com/publication/2022_rep_pvar/Prueser_Blagov_2022_poolingVAR_Slides.pdf
        - text: Code
          href: https://github.com/borisblagov/Blagov_Prueser_2026_Replication
        - text: DOI
          href: https://doi.org/10.1016/j.econmod.2026.107618
      abstract: >-
        We propose a prior for VAR models that exploits the panel structure of macroeconomic time series
        while also providing shrinkage towards zero to address overfitting concerns. The prior is
        flexible as it detects shared dynamics of individual variables across endogenously determined
        groups of countries. We demonstrate the usefulness of our approach in three applications. In the
        first, using a euro area dataset, we demonstrate that combining pairwise pooling with zero
        shrinkage helps with structural analysis by lowering the estimation uncertainty. In the second
        application, we use artificial data to study the bias-variance trade-off between pooling, zero
        shrinkage and no regularization. If the countries are similar, pooling leads only to a small bias
        but still provides a large reduction in the estimation variance. Finally, we use a real dataset
        of a large group of heterogeneous countries to demonstrate that combining pairwise pooling with
        zero shrinkage can improve out-of-sample forecasting relative to only zero shrinkage or only
        pooling specifications.
    - title: "Economic Knock-On Effects of Russia's Geopolitical Risk on Advanced Economies: A Global VAR Approach"
      coauthors: Boris Blagov, Maximilian Dirks, and Michael Funke
      journal: Macroeconomic Dynamics
      biblio: "2025, Vol. 29, e153"
      urls:
        - text: Journal version
          href: https://www.cambridge.org/core/journals/macroeconomic-dynamics/article/economic-knockon-effects-of-russias-geopolitical-risk-on-advanced-economies-a-bayesian-global-var-approach/A636B2EFC867E319D7A12821838BE374
        - text: Working paper
          href: https://www.econstor.eu/bitstream/10419/282988/1/1880241064.pdf  
        - text: Citation
          href: https://borisblagov.com/publication/2025_bfd/cite.bib
        - text: DOI
          href: https://doi.org/10.1017/S1365100525100552
      abstract: >-
        Using a Bayesian Global VAR model as a methodological tool, we analyze how heightened
        geopolitical risk shocks propagate across advanced economies and quantify the economic effects
        of these events. The global VAR impulse response functions in response to the skyrocketing
        Russian geopolitical risk after Russia's invasion of Ukraine revealed a contraction of GDP and
        an increase in inflation. Eastern European and Baltic countries are particularly affected by the
        Russian geopolitical risk shock. We also document a strong component of the Russian geopolitical
        risk shock that is not driven by fossil fuel prices.
    - title: "The macroeconomic impact of asymmetric uncertainty shocks"
      coauthors: Henrik Müller, Boris Blagov, Torsten Schmidt, Jonas Rieger and Carsten Jentsch
      journal: The Journal of Economic Asymmetries
      biblio: "2025, Vol. 31, e00410"
      urls:
        - text: Journal version
          href: https://www.sciencedirect.com/science/article/pii/S1703494925000106
        - text: DOI
          href: https://doi.org/10.1016/j.jeca.2025.e00410
      abstract: >-
        Political shocks impact the economy in different ways, depending of their nature. To capture these effects effectively, we present the Uncertainty Perception Indicator (UPI) based on German newspaper content. This approach combines the time-inherent stability of simple counts of articles with the thematic openness and flexibility of topic models. Using the dynamic RollingLDA technique facilitates the close-to-real-time identification of both the magnitude of an uncertainty shock and its specific characteristics. Hence, the UPI could prove highly useful for economic forecasters and policymakers, since it renders possible more timely and targeted policy reactions. Employing a Bayesian VAR approach, we analyze the effects of various UPI shocks on fixed investment and other macroeconomic variables. Our results document the asymmetric nature of uncertainty shocks, as their consequences are dependent on the respective sources of uncertainty. We find that international shocks only have weak effects on the German macroeconomy, while domestic policy shocks prove to be highly significant. These results markedly differ from earlier studies that, in the case of Germany, tend to maintain the opposite.
    - title: Monetary policy uncertainty and inflation expectations
      coauthors: Gabriel Arce-Alfaro and Boris Blagov
      journal: Oxford Bulletin of Economics and Statistics
      biblio: "2023, Vol. 85(1), 70-94"
      urls:
        - text: Journal version
          href: https://onlinelibrary.wiley.com/doi/10.1111/obes.12516
        - text: Working paper
          href: https://www.econstor.eu/bitstream/10419/232074/1/1752335252.pdf
        - text: Citation
          href: https://borisblagov.com/publication/2023_ab/cite.bib
        - text: DOI
          href: https://doi.org/10.1111/obes.12516
      abstract: >-
        Do inflation expectations react to changes in the volatility of monetary policy? They have, but
        only until the global financial crisis. This paper investigates whether increasing the
        dispersion of monetary policy shocks, which is interpreted as elevated uncertainty surrounding
        monetary policy, affects the inflation expectation formation process. Based on U.S. data since
        the 1980s and a stochastic volatility-in-mean structural VAR model we find that monetary policy
        uncertainty reduces both inflation expectations and inflation. However, after the Great
        Recession this link has disappeared, even when controlling for the Zero Lower Bound.
    - title: Financial integration or financial fragmentation? A euro area perspective
      coauthors: Gabriel Arce-Alfaro and Boris Blagov
      journal: Economic Modelling
      biblio: "2022, Vol. 114, 105902"
      urls:
        - text: Preprint
          href: https://www.econstor.eu/bitstream/10419/249306/1/178662611X.pdf
        - text: PDF
          href: https://www.sciencedirect.com/science/article/abs/pii/S0264999322001481
        - text: Citation
          href: https://borisblagov.com/publication/2022_em/cite.bib
        - text: Dataset
          href: https://borisblagov.com/publication/2022_em/Arce_Alfaro_Blagov_2022_EconomicModelling_Dataset.xlsx
        - text: Slides
          href: https://borisblagov.com/publication/2022_em/Arce_Alfaro_Blagov_2022_Heterogeneity_co-movements_and_financial_fragmentation_within_the_euro_area_Slides.pdf
      abstract: >-
        In this article we address the question of how strongly bank lending rates and credit volumes
        co-move across the euro area. Following the breakdown in the interest rate pass-through across
        the euro area, we aim to disentangle the relative importance of country-specific and common
        components in explaining the variance of the macro and financial variables by using a
        time-varying two-level dynamic factor model. Our results show that a high share is explained by
        the common component. However, we find a persistent decline in the importance of the common
        factor in the bank lending rates, indicating the presence of financial fragmentation.
        Furthermore, we find persistent heterogeneity across member states, specifically those hit hard
        by the sovereign-debt crisis.
    - title: "The regime-dependent evolution of credibility: a fresh look at Hong Kong's linked exchange rate system"
      coauthors: Boris Blagov and Michael Funke
      journal: Macroeconomic Dynamics
      biblio: "2019, Vol. 23(6), 2434-2468"
      urls:
        - text: PDF
          href: https://www.cambridge.org/core/journals/macroeconomic-dynamics/article/regimedependent-evolution-of-credibility-a-fresh-look-at-hong-kongs-linked-exchange-rate-system/F48B76D16030A5731E7C44E873CF0105
        - text: Citation
          href: https://borisblagov.com/publication/2019_md/cite.bib
        - text: DOI
          href: https://doi.org/10.1017/S136510051700075X
      abstract: >-
        An estimated Markov-switching DSGE modeling framework that allows for parameter shifts across
        regimes is employed to test the hypothesis of regime-dependent credibility of Hong Kong's linked
        exchange rate system. The baseline model distinguishes two regimes with respect to the
        time-series properties of the risk premium. Regime-dependent impulse responses to macroeconomic
        shocks reveal substantial differences in spreads. To test the sensitivity of the results, a
        number of robustness checks are performed. The findings contribute to efforts at modeling
        exchange rate regime credibility as a nonlinear process with two distinct regimes.
    - title: Exchange rate uncertainty and import prices in the euro area
      coauthors: Boris Blagov
      journal: Review of International Economics
      biblio: "2019, Vol. 27(5), 1537-1572"
      urls:
        - text: Journal version
          href: https://onlinelibrary.wiley.com/doi/epdf/10.1111/roie.12434
        - text: Citation
          href: https://borisblagov.com/publication/2019_eru/cite.bib
        - text: Poster
          href: https://www.dropbox.com/s/q7qbi8hpolv94jm/Paper_ERU_Poster.pdf?dl=0
        - text: DOI
          href: https://doi.org/10.1111/roie.12434
      abstract: >-
        This paper analyses the effects of exchange rate uncertainty on the pricing behaviour of import
        firms in the euro area. Uncertainty is measured via the volatility of the structural shocks to
        the exchange rate in a non-linear VAR framework and is an important determinant of import
        prices. An increase in exchange rate uncertainty is associated with a fall in prices on average,
        which suggests that the exchange rate risk is borne by the importers. The analysis utilizes a
        dataset on industrial import prices, disaggregated by origin of imports. Controlling for intra-
        and extra-euro area trade is important.
    - title: "Financial crises and time-varying risk premia in a small open economy: a Markov-switching DSGE model for Estonia"
      coauthors: Boris Blagov
      journal: Empirical Economics
      biblio: "2018, Vol. 54(3), 1017-1060"
      urls:
        - text: Journal version
          href: https://www.springerprofessional.de/en/financial-crises-and-time-varying-risk-premia-in-a-small-open-ec/12210778
        - text: Citation
          href: https://borisblagov.com/publication/2018_ee/cite.bib
        - text: Code
          href: https://borisblagov.com/publication/2018_ee/Blagov_2018_Empirical_Economics.7z
        - text: DOI
          href: https://doi.org/10.1007/s00181-017-1256-z
      abstract: >-
        Under a currency board, the central bank relinquishes control over its monetary policy and
        domestic interest rates converge towards the foreign rates. Nevertheless, a spread between both
        usually remains. This spread can be persistently positive due to elevated risk in the economy.
        This paper models that feature by building a DSGE model with a currency board, where the
        domestic interest rate is endogenously derived as a function of the foreign rate, the external
        debt position and an exogenous risk premium component. Time variation in the volatility of the
        risk premium component is then modelled via a Markov-switching component. Estimating the model
        with Bayesian methods and Estonian data shows that the economy does not react much to shocks to
        domestic interest rates in quiet times but is much more sensitive during crises, and matches the
        financial and banking crises, which cannot be captured by the standard DSGE model.
    - title: "The credibility of Hong Kong's currency board system: looking through the prism of MS-VAR models with time-varying transition probabilities"
      coauthors: Boris Blagov and Michael Funke
      journal: Oxford Bulletin of Economics and Statistics
      biblio: "2016, Vol. 78, 895-914"
      urls:
        - text: PDF
          href: https://onlinelibrary.wiley.com/doi/10.1111/obes.12148
        - text: Citation
          href: https://borisblagov.com/publication/2016_ob/cite.bib
        - text: DOI
          href: https://doi.org/10.1111/obes.12148
      abstract: >-
        This paper employs a Markov regime-switching VAR model to describe and analyse the time-varying
        credibility of Hong Kong's currency board system. The endogenously estimated discrete regime
        shifts are made dependent on macroeconomic fundamentals. This enables us to determine which
        changes in macroeconomic variables can trigger switches between the low and high credibility
        regimes. We carry out extensive testing to search for the most appropriate specification of the
        Markov regime-switching model. We find strong evidence of regime switching behaviour that
        portrays the time-varying nature of credibility in the historical data.
working-papers:
    - title: The Tweet is Mightier than the Pen - Social Media Posts, Executive Orders, and Uncertainty
      coauthors: Boris Blagov
      status: "SSRN working paper"
      biblio: "2025"
      urls:
        - text: Working paper
          href: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5225363
      abstract: >-
        We quantify the effects of US trade policy uncertainty (TPU) on its major European partners, calibrating the TPU shock to the observed jump in Q1 2025. We contrast these estimates with a tariff hike in an international general equilibrium model with production networks and find that for the European trading partners, the uncertainty is quantitatively more important than tariffs, which could be dampened by substitution and reallocation effects. 
    - title: "The investment narrative: Improving private investment forecasts with media data"
      coauthors: Boris Blagov, Henrik Müller, Carsten Jentsch, and Torsten Schmidt
      status: "Working Paper - Ruhr Economic Papers No. 921"
      biblio: "2021, No. 921"
      urls:
        - text: Working paper PDF
          href: https://www.econstor.eu/bitstream/10419/242123/1/1770069119.pdf
        - text: Citation
          href: https://borisblagov.com/publication/2021_rep_narratives/cite.bib
        - text: DOI
          href: https://doi.org/10.4419/96973067
      abstract: >-
        Corporate investment in Germany has been relatively weak for a prolonged period after the
        financial crisis. This was remarkable given that interest rates and overall economic activity,
        important determinants of corporate investment, developed quite favourably during that time.
        These developments highlight the fact that the dynamics of business cycles varies over time
        each cycle is somewhat different. A promising new line of research to identify the driving
        factors of business cycles is the use of narratives (Shiller 2017, 2020). Widely shared stories
        capture expectations and beliefs about the workings of the economy that may influence economic
        behavior, such as investment decisions. In this paper, we use Latent Dirichlet Allocation (LDA)
        to identify topics from news (text) data related to corporate investment in Germany and to
        construct suitable indicators. Furthermore, we focus on isolating those investment narratives
        that show the potential to lead to substantial improvement of the forecasting performance of
        econometric models. In our analysis, we demonstrate the benefit of using media-based indicators
        to improve econometric forecasts of business equipment investment. Newspaper data carries
        important information both on the future developments of investment (forecasting) as well as on
        current developments (nowcasting). Moreover, the identified investment narrative enables the
        researcher to improve her/his understanding of the investment process in general and allows to
        incorporate exogenous developments as well as economic sentiment, news and other relevant events
        to the analysis.
    - title: Modelling the time-variation in euro area lending spreads
      coauthors: Boris Blagov, Michael Funke, and Richhild Moessner
      status: "Working Paper - BIS Working Papers No. 526"
      biblio: "2015, No. 526"
      urls:
        - text: PDF
          href: https://www.bis.org/publ/work526.pdf
        - text: Citation
          href: https://borisblagov.com/publication/2015_bis/cite.bib
      abstract: >-
        Using a Markov-switching VAR with endogenous transition probabilities, we analyse what has
        triggered the interest rate pass-through impairment for Italy, Ireland, Spain and Portugal. We
        find that global risk factors have contributed to higher lending rates in Italy and Spain,
        problems in the banking sector help to explain the impairment in Spain, and fiscal problems and
        contagion effects have contributed in Italy and Ireland. We also find that the ECB's
        unconventional monetary policy announcements have had temporary positive effects in Italy. Due
        to the zero lower bound these findings are amplified if EONIA is used as a measure of the policy
        rate. We did not detect changes in the monetary policy transmission for Portugal.


        

